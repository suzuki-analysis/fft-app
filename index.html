<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>加速度波形の解析</title>
<style>
:root{
  --ink:#1b2430; --ink-2:#55606e; --paper:#ffffff; --panel:#ffffff;
  --rule:#cfd3d8; --accent:#2f5d50; --accent-soft:#e7efec; --warn:#9a4b2f;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  font-size:15px;line-height:1.65}
.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 60px}
h1{font-size:21px;font-weight:600;margin:0 0 2px}
.sub{color:var(--ink-2);margin:0 0 18px;font-size:14px}
.cols{display:grid;grid-template-columns:360px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.panel{border:1px solid var(--rule);padding:16px 18px;margin-bottom:14px;background:var(--panel)}
.panel h2{font-size:14px;font-weight:600;margin:0 0 12px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.modes{display:flex;flex-direction:column;gap:8px}
.mode{text-align:left;background:#fff;border:1px solid var(--rule);padding:10px 12px;cursor:pointer;font:inherit;color:inherit}
.mode:hover{border-color:var(--accent)}
.mode[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.mode b{display:block;font-weight:600;font-size:14px}
.mode span{display:block;color:var(--ink-2);font-size:12.5px;line-height:1.45;margin-top:1px}
.drop{border:1px dashed var(--rule);background:#fafafa;padding:18px 12px;text-align:center;color:var(--ink-2);cursor:pointer;font-size:14px}
.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.drop input{display:none}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
label{font-size:14px}
.unit{color:var(--ink-2);font-size:13px}
input[type=number]{width:100px;padding:5px 7px;border:1px solid var(--rule);background:#fff;font:inherit;color:inherit}
input[type=number]:focus,button:focus-visible,.drop:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chs{display:flex;flex-wrap:wrap;gap:6px}
.ch{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--rule);padding:3px 9px;font-size:13.5px;cursor:pointer;background:#fff}
.ch input{accent-color:var(--accent)}
button.run,button.dl{background:var(--accent);color:#fff;border:none;padding:9px 20px;font:inherit;font-weight:600;cursor:pointer}
button.dl{background:#fff;color:var(--accent);border:1px solid var(--accent);font-weight:400;padding:6px 14px}
button:disabled{opacity:.4;cursor:not-allowed}
.status{font-size:13px;color:var(--ink-2);margin-top:8px;min-height:1.3em}
.status.err{color:var(--warn)}
#plot{width:100%;display:block}
#peaks{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:10px}
#peaks th,#peaks td{border-bottom:1px solid var(--rule);padding:5px 8px;text-align:right}
#peaks th:first-child,#peaks td:first-child{text-align:left}
#peaks th{font-weight:600;color:var(--ink-2)}
.hidden{display:none}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-top:6px}
.legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:5px}
ul.notes{margin:6px 0 0;padding-left:1.2em;font-size:12.5px;color:var(--ink-2)}
ul.notes li{margin-bottom:1px}
.empty{color:var(--ink-2);font-size:14px;padding:40px 0;text-align:center}
</style>
</head>
<body>
<div class="wrap">
<h1>加速度波形の解析</h1>
<p class="sub">CSVを読み込んで，フーリエスペクトルまたは地震応答スペクトルを求めます。</p>

<div class="cols">
<div>
  <div class="panel">
    <h2>1. 求めるもの</h2>
    <div class="modes">
      <button class="mode" id="mFourier" aria-pressed="true" type="button">
        <b>フーリエスペクトル</b>
        <span>定常な波形から卓越振動数を読む</span>
      </button>
      <button class="mode" id="mResp" aria-pressed="false" type="button">
        <b>地震応答スペクトル</b>
        <span>地震記録から擬似速度応答 pSv を求める</span>
      </button>
    </div>
    <div class="row hidden" id="kindWrap" style="margin-top:12px;margin-bottom:0">
      <label>波形の種類</label>
      <label class="ch"><input type="radio" name="kind" value="micro" checked> 常時微動</label>
      <label class="ch"><input type="radio" name="kind" value="quake"> 地震記録</label>
    </div>
  </div>

  <div class="panel">
    <h2>2. データ</h2>
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="CSVファイルを選ぶ">
      ここにCSVをドラッグするか，クリックして選択
      <input type="file" id="file" accept=".csv,.txt">
    </div>
    <ul class="notes">
      <li>ヘッダー行は入れず，数値だけにしてください</li>
      <li>時刻の列は不要です。加速度の列だけを並べてください（列数は自由）</li>
      <li>単位は変換しません。換算は倍率で行ってください（g から cm/s² なら 980.665）</li>
    </ul>
    <div class="row" style="margin-top:14px">
      <label for="fs">サンプリング周波数</label>
      <input type="number" id="fs" value="100" min="1" step="1">
      <span class="unit">Hz</span>
    </div>
    <div class="row">
      <label for="scale">倍率</label>
      <input type="number" id="scale" value="1" step="any">
      <span class="unit">読み込んだ値に掛けます</span>
    </div>
    <div id="chWrap" class="hidden">
      <div class="row" style="margin-bottom:6px"><label>チャンネル</label></div>
      <div class="chs" id="chs"></div>
    </div>
  </div>

  <div class="panel">
    <h2>3. 計算</h2>
    <button class="run" id="run" disabled type="button">計算する</button>
    <div class="status" id="status">CSVを読み込んでください。</div>
    <ul class="notes" id="fixed"></ul>
  </div>
</div>

<div>
  <div class="panel">
    <h2 id="outTitle">結果</h2>
    <div class="empty" id="empty">計算すると，ここにグラフが表示されます。</div>
    <div id="out" class="hidden">
      <svg id="plot" role="img" aria-label="解析結果のグラフ"></svg>
      <div class="legend" id="legend"></div>
      <table id="peaks" class="hidden"><thead><tr><th>チャンネル</th><th>順位</th><th>振動数 (Hz)</th><th>振幅</th></tr></thead><tbody></tbody></table>
      <div class="row" style="margin-top:12px;margin-bottom:0"><button class="dl" id="dl" type="button">CSVをダウンロード</button></div>
    </div>
  </div>
</div>
</div>
</div>

<script>
const SEG = 4096, OVERLAP = 0.5, LP = 20, ORDER = 4;
const RMS_HI = 3, RMS_LO = 1/10;
const DAMP = 0.05, TMIN = 0.02, TMAX = 5, NT = 200;
const COLORS = ['#2f5d50','#9a4b2f','#3b5a8c','#7a5a2e','#6b3f6e','#2f6f78'];

let raw = [], nch = 0, mode = 'fourier', result = null;

const $ = id => document.getElementById(id);
const status = (t, err) => { $('status').textContent = t; $('status').className = 'status' + (err ? ' err' : ''); };

function kind(){
  const r = document.querySelector('input[name=kind]:checked');
  return r ? r.value : 'micro';
}

function fixedNotes(){
  const f = $('fixed');
  const lp = '<li>平均値除去 → ローパス 20 Hz（Butterworth 4次，ゼロ位相）</li>';
  if (mode === 'resp'){
    f.innerHTML = lp
      + '<li>波形の全長を用い，減衰定数 h = 0.05 で応答を計算します</li>'
      + '<li>周期 0.02〜5 秒，擬似速度 pSv（入力の単位 × 秒）</li>';
  } else if (kind() === 'micro'){
    f.innerHTML = lp
      + '<li>4096点ごとに分割，50 % 重ね，Hann窓をかけて平均します</li>'
      + '<li>RMSが中央値の3倍を超える区間と1/10を下回る区間は除きます</li>';
  } else {
    f.innerHTML = lp
      + '<li>分割せず，波形の全長で1回だけFFTします</li>'
      + '<li>窓関数はかけません（矩形窓）。区間の除去もしません</li>';
  }
}

function setMode(m){
  mode = m;
  $('mFourier').setAttribute('aria-pressed', m === 'fourier');
  $('mResp').setAttribute('aria-pressed', m === 'resp');
  $('kindWrap').classList.toggle('hidden', m !== 'fourier');
  $('out').classList.add('hidden');
  $('empty').classList.remove('hidden');
  result = null;
  fixedNotes();
}
document.querySelectorAll('input[name=kind]').forEach(r => r.onchange = () => { fixedNotes(); $('out').classList.add('hidden');
  $('empty').classList.remove('hidden'); result = null; });
$('mFourier').onclick = () => setMode('fourier');
$('mResp').onclick = () => setMode('resp');

const drop = $('drop');
drop.onclick = () => $('file').click();
drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('file').click(); } };
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); if (e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]); };
$('file').onchange = e => { if (e.target.files[0]) readFile(e.target.files[0]); };

function readFile(file){
  const r = new FileReader();
  r.onload = () => { try { parse(r.result, file.name); } catch (err) { status(err.message, true); } };
  r.onerror = () => status('ファイルを読めませんでした。', true);
  r.readAsText(file);
}

function parse(text, name){
  const rows = text.split(/\r?\n/).filter(l => l.trim() !== '');
  if (!rows.length) throw new Error('データが空です。');
  const data = [];
  let skipped = 0;
  for (const line of rows){
    const v = line.split(/[,\s;]+/).filter(s => s !== '').map(Number);
    if (!v.length || v.some(x => !isFinite(x))) { skipped++; continue; }
    data.push(v);
  }
  if (data.length < 64) throw new Error('数値の行が足りません。ヘッダーや文字列が含まれていないか確認してください。');
  nch = Math.min(...data.map(v => v.length));
  raw = Array.from({length: nch}, (_, c) => Float64Array.from(data, v => v[c]));
  const chs = $('chs');
  chs.innerHTML = '';
  for (let c = 0; c < nch; c++){
    const l = document.createElement('label');
    l.className = 'ch';
    l.innerHTML = '<input type="checkbox" value="' + c + '"' + (c === 0 ? ' checked' : '') + '> ch' + (c + 1);
    chs.appendChild(l);
  }
  $('chWrap').classList.remove('hidden');
  $('run').disabled = false;
  $('out').classList.add('hidden');
  $('empty').classList.remove('hidden');
  status(name + ' を読み込みました。' + data.length + ' 行，' + nch + ' 列'
    + (skipped ? '（数値でない ' + skipped + ' 行は読み飛ばしました）' : ''));
}

function mean(a){ let s = 0; for (let i = 0; i < a.length; i++) s += a[i]; return s / a.length; }
function rms(a, i0, n){ let s = 0; for (let i = 0; i < n; i++) s += a[i0 + i] * a[i0 + i]; return Math.sqrt(s / n); }
function median(a){ const b = Array.from(a).sort((x, y) => x - y); const m = b.length >> 1;
  return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2; }

function butterLowpassSOS(fc, fs, order){
  const wc = Math.tan(Math.PI * fc / fs), sections = [];
  for (let k = 0; k < order / 2; k++){
    const th = Math.PI * (2 * k + 1) / (2 * order) + Math.PI / 2;
    const re = -Math.cos(th);
    const w2 = wc * wc, d = 1 + 2 * re * wc + w2;
    sections.push({b0: w2 / d, b1: 2 * w2 / d, b2: w2 / d,
                   a1: 2 * (w2 - 1) / d, a2: (1 - 2 * re * wc + w2) / d});
  }
  return sections;
}
function sosOnce(x, sos){
  let y = Float64Array.from(x);
  for (const s of sos){
    let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
    const o = new Float64Array(y.length);
    for (let i = 0; i < y.length; i++){
      const v = s.b0 * y[i] + s.b1 * x1 + s.b2 * x2 - s.a1 * y1 - s.a2 * y2;
      x2 = x1; x1 = y[i]; y2 = y1; y1 = v; o[i] = v;
    }
    y = o;
  }
  return y;
}
function filtfilt(x, sos){
  const n = x.length, pad = Math.min(3 * 2 * sos.length * 2, n - 1);
  const ext = new Float64Array(n + 2 * pad);
  for (let i = 0; i < pad; i++){ ext[i] = 2 * x[0] - x[pad - i]; ext[n + pad + i] = 2 * x[n - 1] - x[n - 2 - i]; }
  ext.set(x, pad);
  let y = sosOnce(ext, sos);
  y.reverse();
  y = sosOnce(y, sos);
  y.reverse();
  return y.slice(pad, pad + n);
}

function fft(re, im){
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++){
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j){ let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; }
  }
  for (let len = 2; len <= n; len <<= 1){
    const ang = -2 * Math.PI / len, wr = Math.cos(ang), wi = Math.sin(ang);
    for (let i = 0; i < n; i += len){
      let cr = 1, ci = 0;
      for (let k = 0; k < len / 2; k++){
        const ur = re[i + k], ui = im[i + k];
        const vr = re[i + k + len / 2] * cr - im[i + k + len / 2] * ci;
        const vi = re[i + k + len / 2] * ci + im[i + k + len / 2] * cr;
        re[i + k] = ur + vr; im[i + k] = ui + vi;
        re[i + k + len / 2] = ur - vr; im[i + k + len / 2] = ui - vi;
        const nr = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = nr;
      }
    }
  }
}

function fourier(x, fs, whole){
  const n = x.length;
  let L;
  if (whole){
    L = 1; while (L * 2 <= n) L <<= 1;      // 全長に収まる最大の2のべき乗
  } else {
    L = SEG; while (L > n) L >>= 1;
  }
  if (L < 64) throw new Error('データが短すぎます。');
  const step = Math.round(L * (1 - OVERLAP));
  const win = new Float64Array(L);
  let wsum = 0;
  for (let i = 0; i < L; i++){
    win[i] = whole ? 1 : 0.5 - 0.5 * Math.cos(2 * Math.PI * i / L);
    wsum += win[i];
  }

  let starts = [];
  if (whole){
    starts = [0];
  } else {
    for (let s = 0; s + L <= n; s += step) starts.push(s);
  }
  let used = starts;
  if (!whole){
    const rs = starts.map(s => rms(x, s, L));
    const med = median(rs);
    const keep = starts.filter((s, i) => rs[i] <= RMS_HI * med && rs[i] >= RMS_LO * med);
    used = keep.length ? keep : starts;
  }

  const K = L / 2 + 1, amp = new Float64Array(K);
  for (const s of used){
    const re = new Float64Array(L), im = new Float64Array(L);
    for (let i = 0; i < L; i++) re[i] = x[s + i] * win[i];
    fft(re, im);
    for (let k = 0; k < K; k++){
      const sc = (k === 0 || k === K - 1) ? 1 / wsum : 2 / wsum;
      amp[k] += Math.hypot(re[k], im[k]) * sc;
    }
  }
  for (let k = 0; k < K; k++) amp[k] /= used.length;
  const f = new Float64Array(K);
  for (let k = 0; k < K; k++) f[k] = k * fs / L;
  return {f, amp, nseg: starts.length, nused: used.length, L, whole};
}

function peaks(f, a, n){
  const c = [];
  for (let i = 1; i < a.length - 1; i++) if (a[i] > a[i - 1] && a[i] >= a[i + 1]) c.push(i);
  c.sort((p, q) => a[q] - a[p]);
  const out = [], minGap = 0.2;
  for (const i of c){
    if (out.every(j => Math.abs(f[i] - f[j]) > minGap)) out.push(i);
    if (out.length >= n) break;
  }
  return out;
}

function matExp(M, n){
  let nrm = 0;
  for (let i = 0; i < n * n; i++) nrm = Math.max(nrm, Math.abs(M[i]));
  const sc = nrm > 0.5 ? Math.max(0, Math.ceil(Math.log2(nrm)) + 1) : 0;
  const A = M.map(v => v / Math.pow(2, sc));
  const mul = (P, Q) => {
    const R = new Float64Array(n * n);
    for (let i = 0; i < n; i++)
      for (let k = 0; k < n; k++){
        const p = P[i * n + k];
        if (p === 0) continue;
        for (let j = 0; j < n; j++) R[i * n + j] += p * Q[k * n + j];
      }
    return R;
  };
  let R = new Float64Array(n * n), T = new Float64Array(n * n);
  for (let i = 0; i < n; i++){ R[i * n + i] = 1; T[i * n + i] = 1; }
  for (let k = 1; k <= 30; k++){
    T = mul(T, A);
    for (let i = 0; i < n * n; i++) T[i] /= k;
    for (let i = 0; i < n * n; i++) R[i] += T[i];
  }
  for (let i = 0; i < sc; i++) R = mul(R, R);
  return R;
}

function sdofCoeff(w, h, dt){
  const M = new Float64Array(16);
  M[1] = dt; M[4] = -w * w * dt; M[5] = -2 * h * w * dt; M[6] = dt; M[11] = dt;
  const E = matExp(M, 4);
  return {
    Ad: [E[0], E[1], E[4], E[5]],
    B1: [E[2] - E[3] / dt, E[6] - E[7] / dt],
    B2: [E[3] / dt, E[7] / dt]
  };
}

function pSvSpectrum(acc, dt){
  const T = [], sv = [];
  for (let i = 0; i < NT; i++) T.push(TMIN + (TMAX - TMIN) * i / (NT - 1));
  for (const Ti of T){
    const m = Math.max(1, Math.ceil(dt / (Ti / 20)));
    let a = acc, h = dt;
    if (m > 1){
      h = dt / m;
      const nn = (acc.length - 1) * m + 1;
      a = new Float64Array(nn);
      for (let i = 0; i < nn; i++){
        const p = i / m, i0 = Math.min(Math.floor(p), acc.length - 2);
        a[i] = acc[i0] + (p - i0) * (acc[i0 + 1] - acc[i0]);
      }
    }
    const w = 2 * Math.PI / Ti;
    const co = sdofCoeff(w, DAMP, h);
    let u = 0, v = 0, mx = 0;
    for (let i = 0; i < a.length - 1; i++){
      const p0 = -a[i], p1 = -a[i + 1];
      const un = co.Ad[0] * u + co.Ad[1] * v + co.B1[0] * p0 + co.B2[0] * p1;
      const vn = co.Ad[2] * u + co.Ad[3] * v + co.B1[1] * p0 + co.B2[1] * p1;
      u = un; v = vn;
      const au = Math.abs(u);
      if (au > mx) mx = au;
    }
    sv.push(w * mx);
  }
  return {T, sv};
}

function selected(){
  return Array.from(document.querySelectorAll('#chs input:checked')).map(e => +e.value);
}

$('run').onclick = () => {
  const fs = +$('fs').value;
  const sc = +$('scale').value;
  const ch = selected();
  if (!(fs > 0)) return status('サンプリング周波数を入力してください。', true);
  if (!isFinite(sc) || sc === 0) return status('倍率に0以外の数値を入力してください。', true);
  if (!ch.length) return status('チャンネルを1つ以上選んでください。', true);
  status('計算しています...');
  setTimeout(() => { try { compute(fs, ch, sc); } catch (e) { status(e.message, true); } }, 20);
};

function compute(fs, ch, scale){
  let fc = LP;
  if (fc >= fs / 2) fc = 0.8 * fs / 2;
  const sos = butterLowpassSOS(fc, fs, ORDER);
  const series = [], rows = [];
  let msg = '';

  for (const c of ch){
    const g = raw[c];
    const mu = mean(g);
    const x = new Float64Array(g.length);
    for (let i = 0; i < g.length; i++) x[i] = (g[i] - mu) * scale;
    const y = filtfilt(x, sos);

    if (mode === 'fourier'){
      const r = fourier(y, fs, kind() === 'quake');
      series.push({name: 'ch' + (c + 1), x: r.f, y: r.amp});
      const pk = peaks(r.f, r.amp, 5);
      pk.forEach((i, k) => rows.push(['ch' + (c + 1), k + 1, r.f[i], r.amp[i]]));
      msg = r.whole ? '全長 ' + r.L + ' 点で1回FFT（窓なし）'
        : r.nused + ' / ' + r.nseg + ' 区間を使用（' + r.L + '点ごとに分割，Hann窓）';
    } else {
      const r = pSvSpectrum(y, 1 / fs);
      series.push({name: 'ch' + (c + 1), x: r.T, y: r.sv});
      msg = '減衰定数 h = 0.05，周期 0.02〜5 秒';
    }
  }

  result = {
    series,
    xlab: mode === 'fourier' ? 'Frequency (Hz)' : 'Period (s)',
    ylab: mode === 'fourier' ? 'Amplitude' : 'pSv',
    xmax: mode === 'fourier' ? Math.min(fc * 1.2, fs / 2) : TMAX,
    rows
  };
  draw();
  status(msg + (fc !== LP ? '（ローパスは ' + fc.toFixed(1) + ' Hz に下げました）' : ''));
}

function draw(){
  const W = 860, H = 420, m = {l: 72, r: 20, t: 18, b: 56};
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const xmax = result.xmax;
  let ymax = 0;
  for (const s of result.series)
    for (let i = 0; i < s.x.length; i++) if (s.x[i] <= xmax && s.y[i] > ymax) ymax = s.y[i];
  ymax = ymax > 0 ? ymax * 1.1 : 1;
  const X = v => m.l + iw * v / xmax, Y = v => m.t + ih * (1 - v / ymax);
  const css = getComputedStyle(document.body);
  const ink = css.getPropertyValue('--ink').trim(), ink2 = css.getPropertyValue('--ink-2').trim();
  const rule = css.getPropertyValue('--rule').trim();
  const F = 'font-family="Arial, Helvetica, sans-serif" font-style="italic"';
  const tick = (lo, hi) => { const st = Math.pow(10, Math.floor(Math.log10(hi - lo)) - 1); const c = [1, 2, 5, 10]
      .map(k => k * st).find(k => (hi - lo) / k <= 8) || st; const o = []; for (let v = 0; v <= hi + 1e-9; v += c) o.push(v); return o; };

  let g = '<rect x="' + m.l + '" y="' + m.t + '" width="' + iw + '" height="' + ih
    + '" fill="none" stroke="' + rule + '"/>';
  for (const v of tick(0, xmax)){
    if (v > xmax) continue;
    g += '<line x1="' + X(v) + '" y1="' + m.t + '" x2="' + X(v) + '" y2="' + (m.t + ih)
      + '" stroke="' + rule + '" stroke-dasharray="2 3"/>'
      + '<text x="' + X(v) + '" y="' + (m.t + ih + 20) + '" text-anchor="middle" font-size="13" fill="'
      + ink2 + '" ' + F + '>' + (+v.toFixed(3)) + '</text>';
  }
  for (const v of tick(0, ymax)){
    if (v > ymax) continue;
    g += '<line x1="' + m.l + '" y1="' + Y(v) + '" x2="' + (m.l + iw) + '" y2="' + Y(v)
      + '" stroke="' + rule + '" stroke-dasharray="2 3"/>'
      + '<text x="' + (m.l - 8) + '" y="' + (Y(v) + 4) + '" text-anchor="end" font-size="13" fill="'
      + ink2 + '" ' + F + '>' + (+v.toPrecision(3)) + '</text>';
  }
  g += '<text x="' + (m.l + iw / 2) + '" y="' + (H - 12) + '" text-anchor="middle" font-size="14" fill="'
    + ink + '" ' + F + '>' + result.xlab + '</text>'
    + '<text x="18" y="' + (m.t + ih / 2) + '" text-anchor="middle" font-size="14" fill="' + ink + '" ' + F
    + ' transform="rotate(-90 18 ' + (m.t + ih / 2) + ')">' + result.ylab + '</text>';

  result.series.forEach((s, si) => {
    let d = '', on = false;
    for (let i = 0; i < s.x.length; i++){
      if (s.x[i] > xmax) break;
      d += (on ? 'L' : 'M') + X(s.x[i]).toFixed(1) + ' ' + Y(Math.min(s.y[i], ymax)).toFixed(1) + ' ';
      on = true;
    }
    g += '<path d="' + d + '" fill="none" stroke="' + COLORS[si % COLORS.length] + '" stroke-width="1.2"/>';
  });

  if (mode === 'fourier'){
    for (const r of result.rows){
      const si = result.series.findIndex(s => s.name === r[0]);
      if (r[2] > xmax) continue;
      g += '<circle cx="' + X(r[2]) + '" cy="' + Y(Math.min(r[3], ymax)) + '" r="3" fill="none" stroke="'
        + COLORS[si % COLORS.length] + '"/>';
      if (r[1] === 1)
        g += '<text x="' + X(r[2]) + '" y="' + (Y(Math.min(r[3], ymax)) - 9) + '" text-anchor="middle" font-size="12" fill="'
          + COLORS[si % COLORS.length] + '" ' + F + '>' + r[2].toFixed(2) + ' Hz</text>';
    }
  }

  const plot = $('plot');
  plot.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  plot.innerHTML = g;

  $('legend').innerHTML = result.series.map((s, i) =>
    '<span><i style="background:' + COLORS[i % COLORS.length] + '"></i>' + s.name + '</span>').join('');
  $('outTitle').textContent = mode === 'fourier' ? 'フーリエスペクトル' : '地震応答スペクトル';

  const tb = $('peaks').querySelector('tbody');
  if (mode === 'fourier' && result.rows.length){
    tb.innerHTML = result.rows.map(r => '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td><td>'
      + r[2].toFixed(3) + '</td><td>' + r[3].toPrecision(4) + '</td></tr>').join('');
    $('peaks').classList.remove('hidden');
  } else {
    tb.innerHTML = '';
    $('peaks').classList.add('hidden');
  }
  $('out').classList.remove('hidden');
  $('empty').classList.add('hidden');
}

$('dl').onclick = () => {
  if (!result) return;
  const head = (mode === 'fourier' ? 'Frequency_Hz' : 'Period_s') + ','
    + result.series.map(s => s.name).join(',');
  const n = result.series[0].x.length;
  const lines = [head];
  for (let i = 0; i < n; i++)
    lines.push(result.series[0].x[i].toPrecision(8) + ',' + result.series.map(s => s.y[i].toPrecision(8)).join(','));
  const blob = new Blob([lines.join('\n')], {type: 'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (mode === 'fourier' ? 'fourier_spectrum.csv' : 'response_spectrum.csv');
  a.click();
  URL.revokeObjectURL(a.href);
};

$('kindWrap').classList.remove('hidden');
fixedNotes();
</script>
</body>
